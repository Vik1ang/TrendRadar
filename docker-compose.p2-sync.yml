# Optional SQLite-to-PostgreSQL adapter. This service reads the existing
# TrendRadar output volume and never starts a crawler or exposes a port.
services:
  ingestion-sync:
    profiles: [p2-sync]
    build:
      context: .
      dockerfile: docker/Dockerfile.intelligence-sync
    restart: unless-stopped
    environment:
      TREND_RADAR_OUTPUT_DIR: /app/output
      TREND_RADAR_TIMEZONE: ${TREND_RADAR_TIMEZONE:-Asia/Shanghai}
      INTELLIGENCE_SYNC_INTERVAL_SECONDS: ${INTELLIGENCE_SYNC_INTERVAL_SECONDS:-60}
      INTELLIGENCE_INGEST_URL: ${INTELLIGENCE_INGEST_URL:-http://ingest-api:3002/api/v1/internal/ingestion}
      INGEST_TOKEN: ${INGEST_TOKEN:?Set INGEST_TOKEN}
      INTELLIGENCE_ENABLED: "true"
      INTELLIGENCE_ANALYSIS_ENABLED: "false"
      INTELLIGENCE_MAX_ANALYSES_PER_RUN: "1"
      INTELLIGENCE_MAX_ANALYSES_PER_DAY: "0"
    volumes:
      - ./output:/app/output:ro
      - p2-ingestion-sync-state:/var/lib/trendradar-sync
    networks:
      - ingestion-private

networks:
  ingestion-private:
    external: true
    name: ${INTELLIGENCE_INGESTION_NETWORK:-trendradar-intelligence-db}

volumes:
  p2-ingestion-sync-state:
