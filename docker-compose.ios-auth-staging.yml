name: trendradar-ios-auth-staging
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?}
      POSTGRES_USER: ${POSTGRES_USER:?}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
    volumes:
      - auth-staging-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 12
    networks: [db]
    restart: unless-stopped
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile.ios-auth-staging
    environment:
      API_HOST: 0.0.0.0
      API_PORT: 3001
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      API_READ_TOKEN: ${STAGING_API_READ_TOKEN:?}
      API_TRUSTED_PROXY_IPS: 172.29.80.4
    ports:
      - "127.0.0.1:13101:3001"
    depends_on:
      postgres: { condition: service_healthy }
    networks:
      db: {}
      edge:
        ipv4_address: 172.29.80.3
    restart: unless-stopped
  ingest-api:
    build:
      context: ./backend
      dockerfile: Dockerfile.ios-auth-staging
    command: ["node", "dist/src/ingestion-server.js"]
    environment:
      INGEST_HOST: 0.0.0.0
      INGEST_PORT: 3002
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      INGEST_TOKEN: ${STAGING_INGEST_TOKEN:?}
      INTELLIGENCE_MAX_ANALYSES_PER_DAY: "0"
    depends_on:
      postgres: { condition: service_healthy }
    networks: [db]
    restart: unless-stopped
  relay-worker:
    build:
      context: ./cloudflare/worker
      dockerfile: Dockerfile.staging
    working_dir: /app
    environment:
      WRANGLER_SEND_METRICS: "false"
    volumes:
      - ${STAGING_RELAY_STATE_DIR:?}:/data
      - ${STAGING_RELAY_VARS_FILE:?}:/app/.dev.vars:ro
    networks: [edge]
    restart: unless-stopped
  relay-agent:
    build: ./relay-agent
    environment:
      RELAY_WORKER_URL: https://ios-auth-staging-gateway
      RELAY_AGENT_TOKEN: ${STAGING_RELAY_AGENT_TOKEN:?}
      LOCAL_API_ORIGIN: http://api:3001
      NODE_EXTRA_CA_CERTS: /etc/ssl/certs/trendradar-staging-root.crt
    volumes:
      - ${STAGING_TLS_DIR:?}/root-ca.crt:/etc/ssl/certs/trendradar-staging-root.crt:ro
    depends_on:
      api: { condition: service_started }
      relay-worker: { condition: service_started }
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:9900/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks: [edge]
    restart: unless-stopped
  https-gateway:
    image: nginx:1.28-alpine
    ports:
      - "192.168.2.117:18443:443"
    volumes:
      - ./deploy/ios-auth-staging/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ${STAGING_TLS_DIR:?}/server.crt:/etc/nginx/tls/server.crt:ro
      - ${STAGING_TLS_DIR:?}/server.key:/etc/nginx/tls/server.key:ro
    depends_on: [api, relay-worker]
    networks:
      edge:
        ipv4_address: 172.29.80.4
        aliases: [ios-auth-staging-gateway]
    restart: unless-stopped
volumes:
  auth-staging-postgres:
    name: trendradar-ios-auth-staging-postgres
networks:
  db:
    name: trendradar-ios-auth-staging-db
    internal: true
  edge:
    name: trendradar-ios-auth-staging-edge
    ipam:
      config: [{ subnet: 172.29.80.0/24 }]
