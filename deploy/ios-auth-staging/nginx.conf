map $http_upgrade $connection_upgrade { default upgrade; '' close; }
server {
  listen 443 ssl;
  server_name 192.168.2.117 ios-auth-staging-gateway;
  allow 192.168.2.0/24;
  # Temporary exact source for the authorized Mac Simulator on its current private subnet.
  allow 192.168.1.91/32;
  deny all;
  ssl_certificate /etc/nginx/tls/server.crt;
  ssl_certificate_key /etc/nginx/tls/server.key;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_session_tickets off;
  server_tokens off;
  client_max_body_size 1m;

  location = /agent {
    allow 172.29.80.0/24;
    deny all;
    proxy_pass http://relay-worker:8787;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_set_header Authorization $http_authorization;
    proxy_read_timeout 3600s;
    proxy_buffering off;
    access_log off;
  }

  location ^~ /relay/ {
    rewrite ^/relay/(.*)$ /$1 break;
    proxy_pass http://relay-worker:8787;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header Authorization $http_authorization;
    proxy_set_header Connection "";
    proxy_read_timeout 30s;
    access_log off;
  }

  location = /api/v2/devices/pair {
    limit_except POST { deny all; }
    proxy_pass http://api:3001;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header Authorization $http_authorization;
    proxy_set_header Connection "";
    access_log off;
  }

  location ^~ /api/v1/ {
    limit_except GET { deny all; }
    proxy_pass http://api:3001;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header Authorization $http_authorization;
    proxy_set_header Connection "";
    access_log off;
  }

  location / { return 404; }
}
